name: Tests

runs:
  using: "composite"

  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ">=24.19.0 <25"
        cache: "npm"

    - name: Install NPM version specified in package.json
      uses: ./.github/actions/install-npm

    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit

    - name: Check LwM2M definitions
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2-utils
        node --experimental-transform-types --no-warnings lwm2m/check-lwm2m-rules.ts

    - name: Generate LwM2M code
      shell: bash
      run: node --experimental-transform-types --no-warnings generator/lwm2m.ts

    - name: Generate model code
      shell: bash
      run: node --experimental-transform-types --no-warnings generator/models.ts

    - name: Generate types and validation code
      shell: bash
      run: node --experimental-transform-types --no-warnings generator/types.ts

    - name: Make sure TypeScript compiles
      shell: bash
      run: npx tsc

    - name: Run tests
      shell: bash
      run: npm test

    - name: Check model data
      shell: bash
      run:
        node --experimental-transform-types --no-warnings
        models/check-model-rules.ts

    - name: Check source code with eslint
      shell: bash
      run: npx eslint ./
